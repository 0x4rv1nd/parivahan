services:
  - type: web
    name: parivahan-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --ignore-scripts
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: FRONTEND_URL
        value: https://frontend-dusky-alpha-59.vercel.app
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: MONGODB_URI
        sync: false